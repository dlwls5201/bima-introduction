name: 피드 자동 갱신

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST (cron은 UTC 기준)
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write # posts.js 커밋을 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 유튜브·인스타 최신 게시물 수집
        run: python3 update_posts.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet posts.js posts.json; then
            echo "새 게시물 없음 — 커밋 생략"
          else
            git add posts.js posts.json
            git commit -m "chore: 피드 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
